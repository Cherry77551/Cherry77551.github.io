<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="18%" cy="12%" r="72%">
      <stop offset="0" stop-color="#d6f0e0"/>
      <stop offset="1" stop-color="#eef8f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="86%" cy="82%" r="68%">
      <stop offset="0" stop-color="#bde5cf"/>
      <stop offset="1" stop-color="#eef8f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shade">
      <stop offset="0%" stop-color="#5c0a12" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5c0a12" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5c0a12" stop-opacity="0"/>
    </radialGradient>

    <g id="camellia">
      <g stroke="#17452c" stroke-width="1.7" stroke-linejoin="round">
        <path d="M0 0 C 20 -17, 52 -16, 76 0 C 52 16, 20 17, 0 0 Z" fill="#2c6b45"/>
        <path d="M0 0 C 20 -17, 52 -16, 76 0 C 52 16, 20 17, 0 0 Z"
              transform="scale(-1,1)" fill="#2c6b45"/>
      </g>

      <g fill="#c53a47" stroke="#7d1119" stroke-width="1.5" stroke-linejoin="round">
        <ellipse cx="0" cy="-32" rx="17" ry="24" transform="rotate(0)"/>
        <ellipse cx="0" cy="-32" rx="17" ry="24" transform="rotate(72)"/>
        <ellipse cx="0" cy="-32" rx="17" ry="24" transform="rotate(144)"/>
        <ellipse cx="0" cy="-32" rx="17" ry="24" transform="rotate(216)"/>
        <ellipse cx="0" cy="-32" rx="17" ry="24" transform="rotate(288)"/>
      </g>

      <g fill="#a51d2a" stroke="#7d1119" stroke-width="1.5" stroke-linejoin="round">
        <ellipse cx="0" cy="-21" rx="14" ry="19" transform="rotate(36)"/>
        <ellipse cx="0" cy="-21" rx="14" ry="19" transform="rotate(108)"/>
        <ellipse cx="0" cy="-21" rx="14" ry="19" transform="rotate(180)"/>
        <ellipse cx="0" cy="-21" rx="14" ry="19" transform="rotate(252)"/>
        <ellipse cx="0" cy="-21" rx="14" ry="19" transform="rotate(324)"/>
      </g>

      <circle r="57" fill="url(#shade)"/>

      <g stroke="#e8c25c" stroke-width="1.9" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-16"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(45)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(90)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(135)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(225)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(270)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(315)"/>
      </g>
      <circle r="4.5" fill="#e8c25c"/>
