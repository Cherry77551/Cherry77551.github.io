  </defs>

  <rect width="1600" height="1000" fill="#f2faf5"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>
  <circle cx="1290" cy="170" r="230" fill="#b9e4cc" opacity="0.4"/>
  <circle cx="230" cy="830" r="320" fill="#a9dcc0" opacity="0.32"/>

  <use href="#camellia" transform="translate(1300,240) scale(1.9) rotate(-14)" opacity="0.10"/>
  <use href="#camellia" transform="translate(280,760) scale(1.25) rotate(16)"  opacity="0.08"/>
  <use href="#camellia" transform="translate(850,110) scale(0.7) rotate(-26)"   opacity="0.06"/>
